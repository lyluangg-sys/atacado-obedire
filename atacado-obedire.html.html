<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atacado Obedire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdfa 0%, #fefce8 100%);
        }
        
        .active-scale:active { transform: scale(0.97); transition: transform 0.1s; }
        .active-scale-95:active { transform: scale(0.95); transition: transform 0.1s; }
        
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-up { animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .btn-amber {
            background: linear-gradient(135deg, #fde68a 0%, #fbbf24 100%);
            transition: all 0.3s ease;
        }
        
        .btn-amber:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(251, 191, 36, 0.4);
        }
        
        .btn-teal {
            background: linear-gradient(135deg, #99f6e4 0%, #5eead4 100%);
            transition: all 0.3s ease;
        }
        
        .btn-teal:hover {
            background: linear-gradient(135deg, #5eead4 0%, #2dd4bf 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(94, 234, 212, 0.4);
        }
        
        .btn-blue {
            background: linear-gradient(135deg, #bfdbfe 0%, #93c5fd 100%);
            transition: all 0.3s ease;
        }
        
        .btn-blue:hover {
            background: linear-gradient(135deg, #93c5fd 0%, #60a5fa 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(147, 197, 253, 0.4);
        }
        
        .card-modern {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }
        
        .card-modern:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
        }
        
        .icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .nav-item {
            transition: all 0.2s ease;
        }
        
        .nav-item:hover {
            transform: translateY(-2px);
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .input-modern {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s ease;
            background: white;
        }
        
        .input-modern:focus {
            outline: none;
            border-color: #5eead4;
            box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.2);
        }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .icon-svg {
            width: 24px;
            height: 24px;
        }
        
        .icon-nav {
            width: 22px;
            height: 22px;
        }
    </style>
</head>

        function getLiveSummaryByClient() {
            const acc = {};

                if (!acc[item.clientCode]) {
                    acc[item.clientCode] = { code: item.clientCode, name: item.clientName, totalQty: 0, totalPrice: 0 };
                }
                acc[item.clientCode].totalQty += safeParseInt(item.qty);

            });

        function getTotalOrdersCount() { return orders.length; }

        function getOrdersByDay() {
            const acc = {};
            orders.forEach(o => {
                const day = o.date;
                if (!acc[day]) {
                    acc[day] = { date: day, orderCount: 0, totalPieces: 0, totalRevenue: 0, liveOrders: 0, directOrders: 0, orders: [] };
                }
                const pieces = o.items.reduce((s, i) => s + safeParseInt(i.qty), 0);
                const revenue = o.items.reduce((s, i) => s + (safeParseFloat(i.price) * safeParseInt(i.qty)), 0);
                acc[day].orderCount += 1;
                acc[day].totalPieces += pieces;
                acc[day].totalRevenue += revenue;
                if (o.type === 'Live') acc[day].liveOrders += 1;
                else acc[day].directOrders += 1;
                acc[day].orders.push(o);
            });
            return Object.values(acc).sort((a, b) => {
                const [da, ma, ya] = a.date.split('/');
                const [db, mb, yb] = b.date.split('/');
                return new Date(`${ya}-${ma}-${da}`) - new Date(`${yb}-${mb}-${db}`);
            });
        }

            days.forEach(d => {

                    grandOrders++; grandPieces += pieces; grandRevenue += revenue;
                });
            });
            
            csv += `\nTOTAL GERAL;;;${grandOrders} pedidos;${grandPieces} peças;;${grandRevenue.toFixed(2).replace('.', ',')};;`;

        // ===== NUEVO: EDITAR CLIENTE =====
        function editClient(code) {
            const client = clients.find(c => c.code === code);
            if (!client) return;
            
            const newCode = prompt("Editar código del cliente:", client.code);
            if (newCode === null) return; // Cancelado
            
            const trimmedCode = newCode.trim();
            if (!trimmedCode) {
                alert("El código no puede estar vacío.");
                return;
            }
            
            // Verificar que el nuevo código no esté en uso por otro cliente
            const existingClient = clients.find(c => c.code === trimmedCode && c.id !== client.id);
            if (existingClient) {
                alert(`⚠️ Ya existe un cliente con el código "${trimmedCode}".`);
                return;
            }
            
            const newName = prompt("Editar nombre del cliente:", client.name);
            if (newName === null) return; // Cancelado
            
            const trimmedName = newName.trim();
            if (!trimmedName) {
                alert("El nombre no puede estar vacío.");
                return;
            }
            
            // Actualizar el cliente
            const oldCode = client.code;
            client.code = trimmedCode;
            client.id = trimmedCode;
            client.name = trimmedName;
            
            // Actualizar pedidos que usen este código
            orders.forEach(o => {
                if (o.clientCode === oldCode) {
                    o.clientCode = trimmedCode;
                    o.clientName = trimmedName;
                }
            });
            
            // Actualizar items en live
            liveItems.forEach(item => {
                if (item.clientCode === oldCode) {
                    item.clientCode = trimmedCode;
                    item.clientName = trimmedName;
                }
            });
            
            // Actualizar borrador si está usando este cliente
            if (draftClientCode === oldCode) {
                draftClientCode = trimmedCode;
                draftClientName = trimmedName;
            }
            
            saveAll();
            render();
            alert(`✅ Cliente actualizado correctamente.\n\nCódigo: ${trimmedCode}\nNombre: ${trimmedName}`);
        }

        function deleteClient(code) {
            const client = clients.find(c => c.code === code);
            if (!client) return;
            
            const orderCount = orders.filter(o => o.clientCode === code).length;
            const liveCount = liveItems.filter(i => i.clientCode === code).length;
            
            let warningMsg = `Tem certeza que deseja excluir o cliente ${code} (${client.name})?\n\nEsta ação não pode ser desfeita.`;
            if (orderCount > 0 || liveCount > 0) {
                warningMsg += `\n\n️ ATENÇÃO:\n- ${orderCount} pedido(s) associado(s) a este cliente\n- ${liveCount} item(s) no Live atual\n\nOs pedidos e itens do Live NÃO serão excluídos, mas ficarão sem cliente vinculado.`;
            }
            
            if (confirm(warningMsg)) {
                clients = clients.filter(c => c.code !== code);
                saveAll();
                render();
                alert(`✅ Cliente ${code} excluído!`);
            }
        }

                            return `<div class="card-modern border border-teal-100 flex items-center justify-between shadow-sm p-3">
                                <div class="flex items-center gap-3 flex-1 min-w-0">
                                    <div class="w-10 h-10 rounded-full text-white font-bold flex items-center justify-center text-sm flex-shrink-0 shadow-md" style="background: linear-gradient(135deg, ${config.primaryColor}, ${config.headerColor})">
                                        ${c.code}
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <h4 class="font-bold text-gray-800 text-sm truncate">${c.name}</h4>
                                        <p class="text-xs text-gray-400">Cadastrado em: ${c.registeredDate}${clientOrders > 0 ? ` • ${clientOrders} pedido(s)` : ''}</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1 flex-shrink-0">
                                    <button onclick="editClient('${c.code}');" class="p-2 text-blue-500 hover:text-blue-700 hover:bg-blue-50 rounded-lg transition-all" title="Editar cliente">
                                        ${icons.edit}
                                    </button>
                                    <button onclick="deleteClient('${c.code}');" class="p-2 text-red-500 hover:text-red-700 hover:bg-red-50 rounded-lg transition-all" title="Excluir cliente">
                                        ${icons.trash}
                                    </button>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            if (currentScreen === 'pedidos') {
                const liveCount = orders.filter(o => o.type === 'Live').length;
                const directCount = orders.filter(o => o.type === 'Directo').length;
                const filteredOrders = orders.filter(o => o.type === orderTab);

                html += `<div class="flex-1 p-4 space-y-4 overflow-y-auto fade-in scrollbar-hide">
                    <div class="card-modern border border-teal-100 p-6 shadow-sm text-center flex flex-col items-center justify-center relative">
                        <div class="mb-3 p-3 rounded-2xl bg-gradient-to-br from-teal-300 to-teal-500 shadow-lg flex items-center justify-center w-16 h-16">
                            ${config.customLogoUrl ? `<img src="${config.customLogoUrl}" alt="Logo" class="object-contain max-h-12 max-w-[48px]">` : `<svg width="36" height="36" viewBox="0 0 100 60" fill="none"><path d="M50 10 L85 35 C85 35, 70 40, 50 40 C30 40, 15 35, 15 35 Z" stroke="white" stroke-width="6" fill="none"/><circle cx="50" cy="10" r="6" fill="white"/><path d="M50 40 L50 52" stroke="white" stroke-width="6"/></svg>`}
                        </div>
                        <h1 class="font-black text-teal-700 text-xl tracking-wider uppercase leading-tight">${config.storeName}</h1>
                        <p class="text-xs text-teal-500 font-semibold mt-1">${config.subtitle}</p>
                        <p class="text-xs text-teal-600 font-semibold italic mt-2">"${config.tagline}"</p>
                    </div>
                    
                    <div class="flex gap-2 bg-gray-100 p-1 rounded-2xl shadow-inner">
                        <button onclick="orderTab='Live'; render()" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all ${orderTab === 'Live' ? 'bg-gradient-to-r from-amber-300 to-amber-400 text-white shadow-md' : 'text-gray-500 hover:text-gray-700'}">🔄 Live (${liveCount})</button>
                        <button onclick="orderTab='Directo'; render()" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all ${orderTab === 'Directo' ? 'bg-gradient-to-r from-teal-300 to-teal-400 text-white shadow-md' : 'text-gray-500 hover:text-gray-700'}">🛒 Directo (${directCount})</button>
                    </div>

                    <div class="space-y-3">
                        ${filteredOrders.length === 0 ? `<div class="card-modern border border-teal-100 p-8 text-center text-gray-400 text-sm">Nenhum pedido ${orderTab} no momento.</div>` : filteredOrders.map(o => {
                            const totalItemQty = o.items.reduce((s, i) => s + safeParseInt(i.qty), 0);
                            const totalVal = o.items.reduce((s, i) => s + (safeParseFloat(i.price) * safeParseInt(i.qty)), 0);
                            return `<div class="card-modern border border-teal-100 shadow-sm space-y-2 hover:shadow-md transition-all relative p-4">
                                <div class="flex justify-between items-center border-b pb-2">
                                    <div class="flex items-center gap-2">
                                        <span class="font-black text-gray-900 text-sm">${o.id}</span>
                                        <span class="status-badge ${o.type === 'Live' ? 'bg-amber-100 text-amber-800' : 'bg-teal-100 text-teal-800'}">${o.type === 'Live' ? '🔄' : '🛒'} ${o.type}</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="status-badge bg-gray-100 text-gray-700">${o.status}</span>
                                        <button onclick="event.stopPropagation(); orderToDelete=orders.find(x=>x.id==='${o.id}'); render();" class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all" title="Excluir">${icons.trash}</button>
                                    </div>
                                </div>
                                <div onclick="selectedOrderId='${o.id}'; currentScreen='pedido_detail'; render();" class="flex justify-between items-center text-sm cursor-pointer pt-1 hover:bg-gray-50 rounded-lg p-2 -mx-2 transition-all">
                                    <div>
                                        <p class="font-bold text-gray-800">${o.clientName}</p>
                                        <p class="text-xs text-gray-500">Cliente #${o.clientCode} • ${totalItemQty} peça(s)</p>
                                        <p class="text-[11px] text-gray-400 flex items-center gap-1 mt-0.5">${icons.calendar} ${o.date} ${o.time ? `às ${o.time}` : ''}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="font-black text-teal-700 text-base block">R$ ${formatMoney(totalVal)}</span>
                                        <span class="text-[11px] text-teal-600 font-bold flex items-center justify-end gap-0.5">Ver Detalhes →</span>
                                    </div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            if (currentScreen === 'pedido_detail' && selectedOrderId) {
                const order = orders.find(o => o.id === selectedOrderId);
                if (order) {
                    const totalQty = order.items.reduce((s, i) => s + safeParseInt(i.qty), 0);
                    const totalVal = order.items.reduce((s, i) => s + (safeParseFloat(i.price) * safeParseInt(i.qty)), 0);
                    html += `<div class="flex-1 p-4 space-y-4 overflow-y-auto fade-in scrollbar-hide">
                        <div class="card-modern border border-teal-100 shadow-sm space-y-3 p-4">
                            <div class="flex justify-between items-center border-b pb-2">
                                <div>
                                    <h3 class="font-bold text-lg text-gray-800">${order.id}</h3>
                                    <span class="text-xs text-gray-400">Origem: ${order.type === 'Live' ? '🔄' : '🛒'} ${order.type}</span>
                                </div>
                                <span class="status-badge bg-amber-100 text-amber-900">${order.status}</span>
                            </div>
                            <div class="text-sm">
                                <p class="font-black text-gray-900 text-base">${order.clientName}</p>
                                <p class="text-xs text-gray-500">Código Cliente: #${order.clientCode} | Data do Pedido: ${order.date} ${order.time ? `às ${order.time}` : ''}</p>
                            </div>
                            <div class="pt-2">
                                <label class="text-xs font-bold text-gray-500 block mb-1">ATUALIZAR STATUS DO PEDIDO:</label>
                                <div class="grid grid-cols-2 gap-1.5 text-xs">
                                    ${['Em separação', 'Separado', 'Embalado', 'Enviado'].map(st => `<button onclick="handleUpdateOrderStatus('${order.id}', '${st}');" class="p-2 rounded-lg font-bold border transition-all ${order.status === st ? 'bg-gradient-to-r from-teal-300 to-teal-400 text-white shadow-md' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'}">${st}</button>`).join('')}
                                </div>
                            </div>
                            <button onclick="orderToDelete=orders.find(x=>x.id==='${order.id}'); render();" class="w-full mt-2 py-2 bg-gradient-to-r from-red-50 to-red-100 hover:from-red-100 hover:to-red-200 text-red-600 border border-red-200 font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 transition-all">
                                ${icons.trash} EXCLUIR ESTE PEDIDO
                            </button>
                        </div>
                        
                        <div class="card-modern border border-teal-100 shadow-sm space-y-3 p-4">
                            <div class="flex justify-between items-center border-b pb-2">
                                <h4 class="font-bold text-xs text-gray-500 uppercase">📦 Peças no Pedido (${order.items.length})</h4>
                                <button onclick="showAddPieceForm=!showAddPieceForm; render();" class="text-xs btn-teal text-teal-900 font-bold px-3 py-1.5 rounded-lg flex items-center gap-1">
                                    ${icons.plus} Adicionar Peça
                                </button>
                            </div>
                            ${showAddPieceForm ? `<div class="p-3 bg-gradient-to-br from-teal-50 to-teal-100 border border-teal-200 rounded-xl space-y-2">
                                <h5 class="font-bold text-xs text-teal-900">Incluir Nova Peça</h5>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="number" step="0.01" placeholder="Preço (R$)" value="${newPiecePrice}" oninput="newPiecePrice=this.value;" class="input-modern text-sm font-bold bg-white">
                                    <input type="number" min="1" placeholder="Qtd" value="${newPieceQty}" oninput="newPieceQty=safeParseInt(this.value)||1;" class="input-modern text-sm font-bold bg-white">
                                </div>
                                <button onclick="handleAddPieceToOrder('${order.id}');" class="w-full py-2 btn-teal text-teal-900 text-xs font-bold rounded-lg">CONFIRMAR ADIÇÃO</button>
                            </div>` : ''}
                            <div class="divide-y">
                                ${order.items.length === 0 ? `<p class="text-center text-xs text-gray-400 py-4">Nenhum item neste pedido.</p>` : order.items.map((item, idx) => {
                                    const itemTotal = safeParseFloat(item.price) * safeParseInt(item.qty);
                                    return `<div class="py-2.5 flex justify-between items-start gap-2">
                                        <div class="flex-1 min-w-0">
                                            <span class="font-bold text-gray-800 block">Peça #${idx + 1}</span>
                                            <span class="text-xs text-teal-700 font-semibold">R$ ${formatMoney(item.price)} cada</span>
                                            ${item.addedAt ? `<span class="text-[10px] text-gray-400 block"> ${item.addedAt}</span>` : ''}
                                        </div>
                                        <div class="flex items-center gap-2 flex-shrink-0">
                                            <div class="flex items-center border-2 border-gray-200 rounded-lg bg-gray-50">
                                                <button onclick="handleUpdateItemQty('${order.id}', '${item.id}', ${safeParseInt(item.qty) - 1})" class="w-7 h-7 font-bold text-gray-600 active:bg-gray-200 flex items-center justify-center hover:bg-gray-100 transition-all">-</button>
                                                <span class="w-8 text-center font-bold text-xs">${safeParseInt(item.qty)}</span>
                                                <button onclick="handleUpdateItemQty('${order.id}', '${item.id}', ${safeParseInt(item.qty) + 1})" class="w-7 h-7 font-bold text-gray-600 active:bg-gray-200 flex items-center justify-center hover:bg-gray-100 transition-all">+</button>
                                            </div>
                                            <span class="font-black text-gray-900 w-20 text-right">R$ ${formatMoney(itemTotal)}</span>
                                            <button onclick="editOrderItem('${order.id}', '${item.id}')" class="p-1 transition-all" title="Editar">${icons.edit}</button>
                                            <button onclick="handleRemoveOrderItem('${order.id}', '${item.id}');" class="p-1 transition-all" title="Eliminar">${icons.trash}</button>
                                        </div>
                                    </div>`;
                                }).join('')}
                            </div>
                            <div class="border-t-2 border-teal-400 pt-3 flex justify-between items-center font-black text-lg text-teal-800">
                                <div><span>TOTAL DO CLIENTE</span><span class="text-xs text-gray-500 font-normal block">${totalQty} peça(s) no total</span></div>
                                <span>R$ ${formatMoney(totalVal)}</span>
                            </div>
                        </div>
                    </div>`;
                }
            }

            if (currentScreen === 'resumo') {
                const days = getOrdersByDay();
                const grandOrders = days.reduce((s, d) => s + d.orderCount, 0);
                const grandPieces = days.reduce((s, d) => s + d.totalPieces, 0);
                const grandRevenue = days.reduce((s, d) => s + d.totalRevenue, 0);
                
                html += `<div class="flex-1 p-4 space-y-4 overflow-y-auto fade-in scrollbar-hide">
                    <h3 class="font-extrabold text-base text-gray-800 uppercase border-b pb-2 flex items-center gap-2">${icons.chart} Resumo Geral de Vendas</h3>
                    <div class="bg-gradient-to-br from-teal-300 to-teal-500 text-white rounded-2xl p-5 shadow-lg space-y-2">
                        <span class="text-xs text-teal-100 uppercase tracking-wider block">Faturamento Total</span>
                        <h2 class="text-3xl font-black">R$ ${formatMoney(getTotalRevenue())}</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="card-modern border border-amber-100 shadow-sm p-4">
                            <span class="text-xs text-gray-400 block mb-1">📦 Total de Pedidos</span>
                            <span class="text-2xl font-black text-gray-800">${getTotalOrdersCount()}</span>
                        </div>
                        <div class="card-modern border border-blue-100 shadow-sm p-4">
                            <span class="text-xs text-gray-400 block mb-1"> Peças Vendidas</span>
                            <span class="text-2xl font-black text-gray-800">${getTotalPiecesCount()}</span>
                        </div>
                    </div>
                    
                    <div class="card-modern border border-teal-100 shadow-sm space-y-3 p-4">
                        <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider">📥 Descargar Reporte Completo</h4>
                        <button onclick="exportCompleteReport();" class="w-full p-4 btn-teal text-teal-900 rounded-xl font-bold text-sm flex items-center gap-3 shadow-lg active-scale-95 text-left transition-all">
                            ${icons.download}
                            <div>
                                <div class="font-bold text-base">Descargar Reporte Completo en Excel</div>
                                <div class="text-xs opacity-90 font-normal mt-1">Incluye todos los pedidos con detalle: fecha, cliente, tipo, piezas, total y hora.</div>
                            </div>
                        </button>
                    </div>
                    
                    ${days.length > 0 ? `<div class="card-modern border border-teal-100 shadow-sm p-4">
                        <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">📅 Resumo Diário (${days.length} dia${days.length > 1 ? 's' : ''})</h4>
                        <div class="space-y-2">
                            ${days.map(d => `<div class="p-3 bg-gradient-to-br from-teal-50 to-teal-100 rounded-xl border border-teal-200">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="font-bold text-sm text-gray-800"> ${d.date}</span>
                                    <span class="text-xs font-bold text-teal-700">${d.orderCount} pedido${d.orderCount > 1 ? 's' : ''}</span>
                                </div>
                                <div class="grid grid-cols-3 gap-2 text-xs">
                                    <div class="text-center bg-white rounded-lg p-2"><span class="text-gray-500 block">👕 Peças</span><span class="font-black text-gray-800">${d.totalPieces}</span></div>
                                    <div class="text-center bg-white rounded-lg p-2"><span class="text-gray-500 block">🔄 Live</span><span class="font-black text-amber-700">${d.liveOrders}</span></div>
                                    <div class="text-center bg-white rounded-lg p-2"><span class="text-gray-500 block">🛒 Directo</span><span class="font-black text-teal-700">${d.directOrders}</span></div>
                                </div>
                                <div class="mt-2 pt-2 border-t border-teal-200 flex justify-between items-center">
                                    <span class="text-xs font-bold text-gray-600">Total do dia:</span>
                                    <span class="font-black text-teal-700 text-sm">R$ ${formatMoney(d.totalRevenue)}</span>
                                </div>
                            </div>`).join('')}
                            <div class="p-3 bg-gradient-to-r from-teal-400 to-teal-500 rounded-xl text-white flex justify-between items-center shadow-lg">
                                <span class="font-bold text-sm">TOTAL GERAL</span>
                                <div class="text-right">
                                    <span class="font-black text-lg block">R$ ${formatMoney(grandRevenue)}</span>
                                    <span class="text-xs opacity-80">${grandOrders} pedidos • ${grandPieces} peças</span>
                                </div>
                            </div>
                        </div>
                    </div>` : ''}
                </div>`;
            }

            if (currentScreen === 'config') {
                html += `<div class="flex-1 p-4 space-y-4 overflow-y-auto pb-20 fade-in scrollbar-hide">
                    <h3 class="font-bold text-lg text-gray-800 border-b pb-2">⚙️ Personalização da Empresa</h3>
                    <div class="space-y-4 card-modern border border-teal-100 shadow-sm p-4 text-sm">
                        <div><label class="text-xs font-bold text-gray-600 block mb-1">NOME DA LOJA</label><input type="text" value="${config.storeName}" oninput="config.storeName=this.value; saveAll();" class="input-modern w-full font-bold"></div>
                        <div><label class="text-xs font-bold text-gray-600 block mb-1">SUBTÍTULO DA LOJA</label><input type="text" value="${config.subtitle}" oninput="config.subtitle=this.value; saveAll();" class="input-modern w-full font-medium"></div>
                        <div><label class="text-xs font-bold text-gray-600 block mb-1">SLOGAN DA PORTADA</label><input type="text" value="${config.tagline}" oninput="config.tagline=this.value; saveAll();" class="input-modern w-full"></div>
                        <div class="p-3 bg-gray-50 rounded-xl border space-y-2">
                            <label class="text-xs font-extrabold text-teal-800 block uppercase">🖼️ Logo da Loja (Upload de Arquivo Local)</label>
                            <div class="flex items-center gap-3">
                                ${config.customLogoUrl ? `<img src="${config.customLogoUrl}" alt="Logo" class="w-14 h-14 object-contain border-2 border-teal-200 rounded-lg bg-white p-1">` : `<div class="w-14 h-14 rounded-lg bg-gradient-to-br from-teal-100 to-teal-200 flex items-center justify-center text-teal-800 text-2xl">🖼️</div>`}
                                <div class="flex-1 space-y-1">
                                    <label class="px-3 py-2 btn-teal text-teal-900 rounded-xl font-bold text-xs flex items-center justify-center gap-1 cursor-pointer shadow">
                                        📤 Carregar Logo Local
                                        <input type="file" accept="image/*" onchange="handleLogoFileUpload(event)" class="hidden">
                                    </label>
                                    ${config.customLogoUrl ? `<button onclick="config.customLogoUrl=''; saveAll(); render();" class="w-full py-1 text-[11px] text-red-600 font-bold flex items-center justify-center gap-1 hover:bg-red-50 rounded transition-all">🗑️ Remover Logo</button>` : ''}
                                </div>
                            </div>
                            <div><label class="text-[11px] font-bold text-gray-500 block mt-2">Tamanho / Escala do Logo: ${config.logoScale}px</label><input type="range" min="60" max="220" value="${config.logoScale}" oninput="config.logoScale=parseInt(this.value); saveAll(); render();" class="w-full accent-teal-500"></div>
                        </div>
                        <div class="p-3 bg-gray-50 rounded-xl border space-y-2">
                            <label class="text-xs font-extrabold text-teal-800 block uppercase"> Fundo da Portada (Upload de Arquivo Local)</label>
                            <div class="flex items-center gap-3">
                                ${config.coverBgUrl ? `<div class="w-14 h-14 rounded-lg bg-cover bg-center border-2 border-teal-200 shadow-sm" style="background-image: url(${config.coverBgUrl})"></div>` : `<div class="w-14 h-14 rounded-lg bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center text-gray-500 text-2xl">🖼️</div>`}
                                <div class="flex-1 space-y-1">
                                    <label class="px-3 py-2 btn-teal text-teal-900 rounded-xl font-bold text-xs flex items-center justify-center gap-1 cursor-pointer shadow">
                                         Carregar Imagem Local
                                        <input type="file" accept="image/*" onchange="handleCoverBgFileUpload(event)" class="hidden">
                                    </label>
                                    ${config.coverBgUrl ? `<button onclick="config.coverBgUrl=''; saveAll(); render();" class="w-full py-1 text-[11px] text-red-600 font-bold flex items-center justify-center gap-1 hover:bg-red-50 rounded transition-all">🗑️ Usar Cor Sólida</button>` : ''}
                                </div>
                            </div>
                        </div>
                        <div><label class="text-xs font-bold text-gray-600 block mb-1"> COR PRINCIPAL / HEADER</label><div class="flex gap-2 items-center"><input type="color" value="${config.primaryColor}" oninput="config.primaryColor=this.value; config.headerColor=this.value; saveAll(); render();" class="w-12 h-10 rounded border cursor-pointer"><input type="text" value="${config.primaryColor}" oninput="config.primaryColor=this.value; config.headerColor=this.value; saveAll(); render();" class="input-modern flex-1 font-mono text-xs"></div></div>
                        <div><label class="text-xs font-bold text-gray-600 block mb-1">✨ COR DOS BOTÕES DE DESTAQUE</label><div class="flex gap-2 items-center"><input type="color" value="${config.accentYellow}" oninput="config.accentYellow=this.value; saveAll(); render();" class="w-12 h-10 rounded border cursor-pointer"><input type="text" value="${config.accentYellow}" oninput="config.accentYellow=this.value; saveAll(); render();" class="input-modern flex-1 font-mono text-xs"></div></div>
                    </div>
                    <button onclick="currentScreen='cover'; render();" class="w-full py-3 btn-teal text-teal-900 font-bold rounded-xl shadow-lg flex items-center justify-center gap-2">
                        💾 SALVAR E VER PORTADA
                    </button>
                </div>`;
            }

            if (currentScreen !== 'cover') {
                html += `<nav class="fixed bottom-0 max-w-md w-full glass-effect border-t border-teal-100 flex justify-around items-center py-3 z-10 shadow-lg">
                    <button onclick="currentScreen='home'; render();" class="nav-item flex flex-col items-center text-xs font-bold ${currentScreen === 'home' ? 'text-teal-600' : 'text-gray-400'}">
                        ${icons.home}
                        <span>Início</span>
                    </button>
                    <button onclick="currentScreen='clientes'; render();" class="nav-item flex flex-col items-center text-xs font-bold ${currentScreen === 'clientes' ? 'text-teal-600' : 'text-gray-400'}">
                        ${icons.users}
                        <span>Clientes</span>
                    </button>
                    <button onclick="currentScreen='pedidos'; render();" class="nav-item flex flex-col items-center text-xs font-bold ${['pedidos', 'pedido_detail'].includes(currentScreen) ? 'text-teal-600' : 'text-gray-400'}">
                        ${icons.package}
                        <span>Pedidos</span>
                    </button>
                    <button onclick="currentScreen='resumo'; render();" class="nav-item flex flex-col items-center text-xs font-bold ${currentScreen === 'resumo' ? 'text-teal-600' : 'text-gray-400'}">
                        ${icons.chart}
                        <span>Resumo</span>
                    </button>
                </nav>`;
            }

            app.innerHTML = html;
        }

        render();
    </script>
</body>
</html>
